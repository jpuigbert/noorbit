name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Construeix els instal·ladors natius per macOS (universal), Windows i Linux,
# i els publica com a assets del GitHub Release.
#
# Disparadors:
#   1. En crear/puxar un tag `v*` (p. ex. `git tag v0.5.0 && git push --tags`).
#   2. Manualment des de la pestanya Actions → "Run workflow".
#
# Seguretat: aquest workflow NO es dispara des de `pull_request` i no
# interpola cap camp de l'event (payload de PR, issue, comment, branch, etc.)
# en `run:`. Les úniques variables que arriben a la comanda de build
# provenen del matrix estàtic del propi workflow.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a construir (p. ex. v0.6.0)"
        required: true
        default: "v0.6.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-universal
            os: macos-latest
            build_cmd: "app:build:mac:universal"

          - id: windows
            os: windows-latest
            build_cmd: "app:build:win"

          - id: linux
            os: ubuntu-22.04
            build_cmd: "app:build:linux"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # ── macOS: afegeix els dos targets per al build universal ────────────
      - name: Add Rust targets (universal macOS)
        if: matrix.id == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # ── Linux: dependències del sistema requerides per Tauri ─────────────
      - name: Install Linux system deps
        if: matrix.id == 'linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev rpm patchelf

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # ── Build: la comanda del matrix passa per ENV, no interpolada ───────
      - name: Build (${{ matrix.id }})
        env:
          NOORBIT_SCRIPT: ${{ matrix.build_cmd }}
        run: pnpm "$NOORBIT_SCRIPT"
        shell: bash

      # ── macOS: firma ad-hoc (codesign --sign -) perquè l'app arrenchi amb
      # doble clic a qualsevol Mac. Sense signatura, macOS 15+ rebutja
      # l'obertura («l'aplicació està malmesa»). Es firma la .app JA
      # empaquetada i es torna a generar el DMG amb la còpia signada, de
      # manera que el que es publica als releases ja ve firmat.
      - name: Ad-hoc codesign + rebuild DMG/zip (macOS)
        if: matrix.id == 'macos-universal'
        run: |
          VER=$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/src-tauri/tauri.conf.json','utf8')).version")
          BUNDLE=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          codesign --force --deep --sign - "$BUNDLE/macos/NoOrbit.app"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE/macos/NoOrbit.app"
          # regenera el DMG amb la .app signada (substitueix l'unsigned)
          STAGE=$(mktemp -d)
          cp -R "$BUNDLE/macos/NoOrbit.app" "$STAGE/NoOrbit.app"
          ln -s /Applications "$STAGE/Applications"
          rm -f "$BUNDLE"/dmg/*.dmg
          hdiutil create -volname NoOrbit -srcfolder "$STAGE" -ov -format UDZO "$BUNDLE/dmg/NoOrbit_${VER}_universal.dmg"
          rm -rf "$STAGE"
          # comprimit .app també amb la signatura inside
          cd "$BUNDLE/macos"
          if [ -d NoOrbit.app ]; then
            rm -f NoOrbit.app.zip
            zip -r -y NoOrbit.app.zip NoOrbit.app
          fi

      # ── Pujar artefactes (cada SO genera rutes diferents; les llistem totes)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noorbit-${{ matrix.id }}
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/NoOrbit.app.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
          if-no-files-found: warn
          retention-days: 7

  # ── Publica el GitHub Release amb tots els assets ────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    # Només quan el disparador és un tag `v*` (no per workflow_dispatch sol)
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -la artifacts/

      # ── Sistema de releases nou: índex «versions.json» ───────────────────
      # Genera un JSON amb TOTES les versions publicades (la nova i les
      # velles, amb els seus URLs d'dmg/exe/deb…) i l'adjunta al release.
      # Qualsevol (la app, la wiki o un script) pot consultar l'última
      # versió descarregant només aquest fitxer. Les releases anteriors NO
      # es toquen mai: a GitHub cada tag és un release independent i els
      # de versions velles queden disponibles per a qui se les vulgui
      # descarregar.
      - name: Build versions.json (index of ALL releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/releases \
            --paginate \
            --jq 'map(select(.draft==false) | {
              tag: .tag_name,
              name: .name,
              date: .published_at,
              latest: .latest,
              assets: [.assets[] | {name: .name, url: .browser_download_url, size: .size}]
            }) | sort_by(.tag) | {updated: now|todate, versions: .}' > artifacts/versions.json
          cat artifacts/versions.json | head -c 600; echo

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app.zip
            artifacts/**/*-setup.exe
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.tar.gz
            artifacts/versions.json
          generate_release_notes: true
          # Cos del release: capçalera de novetats + on són les versions
          # velles. generate_release_notes hi afegeix sota la llista de
          # commits/PR des de l'últim tag.
          body: |
            ## NoOrbit 0.61.2-alpha — novetats

            - **Errors de sintaxi detectats fins i tot sense obrir el fitxer**: quan la IA escriu fitxers, NoOrbit els revisa offline (JSON real + balanceig de claudàtors per a TS/JS, Python, Rust, C…) i els errors apareixen al panell *Problemes* i com a ratlles vermelles en obrir-los.
            - **Quick-fix estil Eclipse**: clica sobre l'error i prem **⌘+1** (Ctrl+1 a Windows/Linux) per aplicar la correcció suggerida (tanca claudàtors/cometes, esborra caràcters sobrers…); **⇧⌘+1** demana a la IA local que repari l'error.
            - **Suggeriments en escriure**: autocomplete natiu de Monaco per a TS/JS/JSON/CSS/HTML, en línia i sense connexió.
            - **DMG universal signat ad-hoc** (`codesign --force --deep --sign -`): instal·lable amb **doble clic** a qualsevol Mac (Intel i Apple Silicon). La primera vegada, si Gatekeeper es queixa: clic dret → *Obre*, o `xattr -dr com.apple.quarantine /Applications/NoOrbit.app`.
            - **Windows**: el `-setup.exe` s'instal·la amb doble clic (usuari actual, sense admin). **Debian/Ubuntu**: `.deb` amb doble clic (GDebi/centre de programari) o `sudo apt install ./NoOrbit_…_amd64.deb`.

            Instruccions completes d'instal·lació a qualsevol SO: fitxer `INSTALL.md` del repositori.

            Les **versions anteriors** segueixen disponibles per descarregar a https://github.com/jpuigbert/noorbit/releases — i l'índex complet de versions i assets és el fitxer adjunt `versions.json`.
          draft: false
          prerelease: false
          # La versió nova passa a ser la «Latest» sense esborrar res: els
          # tags vells conserven els seus releases i assets intactos.
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Un cop publicat, regenerem el versions.json perquè inclogui TAMBE
      # el release que acabem de crear (abans de publicar-ho, l'índex només
      # podia contenir les versions anteriors) i el substituïm com a asset.
      - name: Refresh versions.json (now including this release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="versions.json") | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/releases/assets/{}" || true
          gh api repos/${{ github.repository }}/releases \
            --paginate \
            --jq 'map(select(.draft==false) | {
              tag: .tag_name,
              name: .name,
              date: .published_at,
              latest: .latest,
              assets: [.assets[] | {name: .name, url: .browser_download_url, size: .size}]
            }) | sort_by(.tag) | {updated: now|todate, versions: .}' > versions.json
          gh release upload "$TAG" versions.json --clobber
