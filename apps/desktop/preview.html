<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <title>NoOrbit · preview Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ── STUB NOMÉS PER A LA VISTA PRÈVIA AL NAVEGADOR ──────────────────
      // NoOrbit és una app Tauri: al navegador no existeix el pont natiu i
      // getCurrentWebviewWindow() peta llegint __TAURI_INTERNALS__.metadata.
      // Açò imitationa el mínim perquè la interfície es pinte i es puga
      // revisar el disseny. NO forma part de l'app.
      const listeners = new Map();
      let cbId = 1;
      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { label: "main", windowLabel: "main" },
        },
        transformCallback(cb) {
          const id = cbId++;
          listeners.set(id, cb);
          return id;
        },
        unregisterCallback(id) {
          listeners.delete(id);
        },
        convertFileSrc(p) {
          return p;
        },
        async invoke(cmd, args) {
          switch (cmd) {
            case "plugin:event|listen":
            case "plugin:event|unlisten":
              return 1;
            case "ai_provider_list":
            case "web_ia_list":
            case "experts_list":
            case "learning_list":
            case "agent_chats_load":
            case "ollama_list_models":
            case "task_list":
            case "agent_check_backends":
            case "ollama_loaded_models":
            case "list_external_volumes":
            case "ollama_search_cloud":
            case "ollama_search_huggingface":
            case "civitai_search":
            case "hf_bay_search":
              return [];
            case "ai_current_provider":
              return "";
            case "settings_load":
              return {};
            case "ollama_status":
              return { running: false, version: null };
            default:
              return null;
          }
        },
      };
    </script>
    <script type="module" src="/src/preview-entry.tsx"></script>
  </body>
</html>
