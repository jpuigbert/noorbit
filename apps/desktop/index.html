<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoOrbit</title>
    <script>
      /// Vigiland d'arrencada. Si el paquet JS ni tan sols s'executa (import
      /// trencat, fitxer absent, CSP, error de sintaxi), cap ErrorBoundary de
      /// React pot entrar en joc: la finestra quedaria en blanc i muda.
      /// Aquest script, inline i sense dependències, pinta l'error en pantalla.
      (function () {
        var bootErrors = [];

        function panel() {
          var el = document.getElementById("boot-error");
          if (!el) {
            el = document.createElement("div");
            el.id = "boot-error";
            el.setAttribute(
              "style",
              "position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;" +
                "align-items:center;justify-content:center;gap:12px;padding:24px;" +
                "background:#0d0d12;color:#e8e8f0;font-family:-apple-system,'Segoe UI',sans-serif;text-align:center;"
            );
            el.innerHTML =
              '<h1 style="font-size:18px;margin:0">NoOrbit no s\'ha iniciat</h1>' +
              '<p style="max-width:560px;font-size:13px;line-height:1.5;color:#b4b4c4;margin:0">' +
              "El codi de la interfície no s'ha pogut carregar o bé ha fallat abans de pintar res.</p>" +
              '<pre id="boot-error-detail" style="max-width:760px;width:100%;max-height:45vh;overflow:auto;text-align:left;' +
              'font-size:11px;line-height:1.45;font-family:Menlo,monospace;color:#8282a0;background:#17171f;' +
              'border:1px solid #23232e;border-radius:6px;padding:12px;white-space:pre-wrap;margin:0"></pre>' +
              '<button style="font-size:13px;padding:6px 14px;border-radius:6px;border:0;background:#7c5cff;color:#fff;cursor:pointer" ' +
              "onclick=\"location.reload()\">Torna a provar-ho</button>";
            document.body.appendChild(el);
          }
          var pre = document.getElementById("boot-error-detail");
          pre.textContent = bootErrors.join("\n\n");
        }

        function note(text) {
          bootErrors.push(text);
          if (bootErrors.length <= 4) panel();
        }

        // Error de script o de càrrega d'un mòdul (capturem també els de recursos).
        window.addEventListener(
          "error",
          function (e) {
            if (e && e.message) {
              note(e.message + "\n  " + (e.filename || "?") + ":" + (e.lineno || 0) + ":" + (e.colno || 0));
            } else if (e && e.target && e.target.tagName) {
              note("No s'ha pogut carregar el recurs: " + (e.target.src || e.target.href));
            }
          },
          true
        );

        // Si als 6 segons l'arbre de React encara és buit, ho diem ben clar.
        setTimeout(function () {
          var root = document.getElementById("root");
          if (!root || root.childNodes.length === 0) {
            note("L'element #root segueix buit després de 6 s: el mòdul d'entrada no s'ha executat.");
          }
        }, 6000);

        // Si finalment React aconsegueix pintar, esborrem l'avís.
        new MutationObserver(function (records, obs) {
          var root = document.getElementById("root");
          if (root && root.childNodes.length > 0) {
            var el = document.getElementById("boot-error");
            if (el) el.remove();
            obs.disconnect();
          }
        }).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
