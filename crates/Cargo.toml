[workspace]
resolver = "2"
members = [
    "noorbit-guardian",
    "noorbit-jam",
    "noorbit-planner",
    "noorbit-git",
    "noorbit-worktree",
    "noorbit-reporter",
    "noorbit-llm-openai",
    "noorbit-signal",
    "noorbit-godot",
    "noorbit-memguard",
    "noorbit-persistence",
    "noorbit-blender",
    "noorbit-blender-import",
    "noorbit-lessons",
]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
libc = "0.2"
httpdate = "1"
quick-xml = "0.36"
tempfile = "3"
sha2 = "0.10"
dirs = "5.0"
once_cell = "1"
